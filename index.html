        "address": [

            "@type": "PostalAddress",
            "streetAddress": "Av. Osvaldo Reis, 3281 - Praia Brava",
            "addressLocality": "Itajaí",
            "addressRegion": "SC",
            "postalCode": "88306-002",

          {
            "@type": "PostalAddress",
