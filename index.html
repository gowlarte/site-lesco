    <!-- Captura precoce de UTMs (last-touch, por sessão de navegação).
         A injeção nos formulários GHL acontece via query param na src do
         iframe (ver src/lib/utm.ts), pois os forms são iframes cross-origin. -->

    <script>
    (function () {
      // Captura precoce das UTMs (last-touch) na MESMA fonte de verdade usada
      // pelo app: sessionStorage 'lesco_utm'. Só grava quando há sinal real de
      // campanha na URL, para que uma entrada direta/orgânica não herde campanha
      // antiga. Não usamos mais localStorage de 24h (evita "ressurreição").
      try {
        var KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term',
                    'campaign_id','adset_id','ad_id','gclid','fbclid'];
        var SIGNAL = ['utm_source','utm_medium','utm_campaign','campaign_id','gclid','fbclid'];
        var p = new URLSearchParams(window.location.search);
        var hasSignal = SIGNAL.some(function (k) { return p.get(k); });
        if (hasSignal) {
          var values = {};
          KEYS.forEach(function (k) { var v = p.get(k); if (v) values[k] = v; });
          values.url_conversao = window.location.href;
          try { sessionStorage.setItem('lesco_utm', JSON.stringify(values)); } catch (e) {}
        }
      } catch (e) {}
    })();
    </script>
